# tackle — one pnpm workspace over four independent tools + one leaf protocol.
#
# Dependency law (enforce with joggle/import-architecture on this repo):
#   protocol  ← depends on nothing
#   plumb     ← protocol          (never joggle, cutlist, jig)
#   joggle    ← protocol          (never plumb, cutlist, jig)
#   cutlist   ← protocol          (never plumb, joggle, jig)
#   jig       ← protocol + drives the other three as processes

packages:
  - "packages/*"
  - "examples/*"
  # The foreman's own harness. Deliberately outside `packages/`: it is not a fifth
  # tool, it drives the four. It joins the workspace only so `pnpm check` reaches it.
  - "tools/*"

# Pin shared runtime versions ONCE. Effect is a shared runtime, so pin exactly —
# never a caret — and bump deliberately across every package at the same time.
catalog:
  effect: "4.0.5" # stable v4
  # The OpenCode plugin API, used only by jig's optional `./opencode` surface.
  "@opencode/plugin": "2.1.2"
  "@effect/platform-node": "4.0.5"
  "@effect/vitest": "4.0.5"
  # joggle's judgement model: Effect's AI surface plus the TypeSafe provider. On the
  # stable line with the rest of the workspace now that joggle's port landed.
  "@effect/ai-typesafe": "4.0.5"
  # Typechecking and building run on TypeScript 7's native compiler, wearing
  # Effect's language service (@effect/tsgo) via the `prepare` patch. TypeScript 7
  # ships no programmatic API, so the `typescript` name stays aliased to the
  # TypeScript 6 compatibility package for the tooling that imports it
  # (typescript-eslint), and the compiler is the `@typescript/native` alias —
  # `tsc` is 7, `tsc6` is 6, and both sit side by side. Keep them on the versions
  # @effect/tsgo lists as supported.
  "@effect/tsgo": "0.56.0"
  typescript: "npm:@typescript/typescript6@^6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # plumb's rules import the plugin API, so it must track the oxlint that loads it.
  "@oxlint/plugins": "1.89.0"
  oxc-parser: "0.150.0"
  # Mermaid -> SVG, for cutlist's diagram projection. Pure: `render()` needs no DOM, falling
  # back to a built-in width table, so the artifact carries rendered diagrams, not a promise.
  pele: "1.7.0"
  oxlint: "1.89.0" # pinned in lockstep with @effect/tsgo 0.56.0
  "oxlint-tsgolint": "7.0.2004" # type-aware oxlint glue, paired with oxlint 1.89.0
  oxfmt: "0.74.0" # the Oxc formatter, alongside the Oxc linter
  vitest: "5.0.1"
  "@types/node": "24.13.5"
  # Property-based testing. `plumb/prefer-property-tests` requires it in every suite; the
  # workspace's tests default to properties over examples where the claim is general.
  "fast-check": "4.10.2"
  # The outside judge for the lexicon schemas: a JSON-Schema validator that is not the
  # TypeScript. Draft 2020-12, which is what schema/*.json declares. Dev-only; protocol's
  # runtime stays dependency-free.
  ajv: "8.17.1"

# `@opencode/plugin` (jig's optional, dev-only peer) pins `effect@4.0.1` and its own
# `@effect/*` tree. In this workspace that installs a SECOND copy of Effect, which the
# type-aware lint reports as `effecttsgo/duplicate-package` — and two Effect identities
# in one program is a real hazard, even in a dev tree. Pin the whole graph to the
# workspace's line; the plugin is never shipped, and the public surface still gets the
# host's own `@opencode/plugin` at runtime.
overrides:
  effect: "4.0.5"
  "@effect/platform-node": "4.0.5"
  "@effect/platform-node-shared": "4.0.5"
  "@effect/opentelemetry": "4.0.5"

minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.56.0"
  - "@effect/tsgo-darwin-x64@0.56.0"
  - "@effect/tsgo-linux-arm64@0.56.0"
  - "@effect/tsgo-linux-arm@0.56.0"
  - "@effect/tsgo-linux-x64@0.56.0"
  - "@effect/tsgo-win32-arm64@0.56.0"
  - "@effect/tsgo-win32-x64@0.56.0"
  - "@effect/tsgo@0.56.0"
  - "@opencode/ai@2.1.2"
  - "@opencode/client@2.1.2"
  - "@opencode/plugin@2.1.2"
  - "@opencode/protocol@2.1.2"
  - "@opencode/schema@2.1.2"
  - "@opencode/util@2.1.2"
  - pele@1.7.0
