# tackle — one pnpm workspace over four independent tools + one leaf protocol.
#
# Dependency law (enforce with joggle/import-architecture on this repo):
#   protocol  ← depends on nothing
#   plumb     ← protocol          (never joggle, cutlist, jig)
#   joggle    ← protocol          (never plumb, cutlist, jig)
#   cutlist   ← protocol          (never plumb, joggle, jig)
#   jig       ← protocol + drives the other three as processes

packages:
  - "packages/*"
  - "examples/*"
  # The foreman's own harness. Deliberately outside `packages/`: it is not a fifth
  # tool, it drives the four. It joins the workspace only so `pnpm check` reaches it.
  - "tools/*"

# Pin shared runtime versions ONCE. Effect is a shared runtime, so pin exactly —
# never a caret — and bump deliberately across every package at the same time.
catalog:
  effect: "4.0.5" # stable v4
  # The OpenCode plugin API, used only by jig's optional `./opencode` surface.
  "@opencode/plugin": "2.0.31"
  "@effect/platform-node": "4.0.5"
  "@effect/vitest": "4.0.5"
  # Typechecking and building run on `tsgo`, the native compiler, wearing Effect's
  # language service (@effect/tsgo) via the `prepare` patch. `tsc` is not installed.
  "@effect/tsgo": "0.53.3"
  "@typescript/native-preview": "7.0.0-dev.20260707.2"
  oxc-parser: "0.150.0"
  # Mermaid -> SVG, for cutlist's diagram projection. Pure: `render()` needs no DOM, falling
  # back to a built-in width table, so the artifact carries rendered diagrams, not a promise.
  pele: "1.7.0"
  oxlint: "1.88.0" # 1.88.0 is the newest @effect/tsgo 0.53.3 supports
  "oxlint-tsgolint": "7.0.2004" # type-aware oxlint glue, paired with oxlint 1.88.0
  oxfmt: "0.73.0" # the Oxc formatter, alongside the Oxc linter
  vitest: "5.0.1"
  "@types/node": "24.13.5"
  # Property-based testing. `plumb/prefer-property-tests` requires it in every suite; the
  # workspace's tests default to properties over examples where the claim is general.
  "fast-check": "4.10.2"
  # The outside judge for the lexicon schemas: a JSON-Schema validator that is not the
  # TypeScript. Draft 2020-12, which is what schema/*.json declares. Dev-only; protocol's
  # runtime stays dependency-free.
  ajv: "8.17.1"

# The rc line is not resolvable from its ranges alone. The published
# `@effect/platform-node@4.0.0-rc.116` carries a *caret* on
# `@effect/platform-node-shared`, so a resolve without joggle's (now deleted)
# nested lockfile floats that one package onto the stable line — where it then
# imports `effect/dist/process/ChildProcess.js`, which rc.116's `effect` does not
# have. `joggle` is still on `4.0.0-rc.116`; its port to 4.0.5 is its own step.
# Pin that single edge so the rc tree stays coherent, and leave the 4.0.5
# consumers (cutlist, jig-cli, the OpenCode plugin) untouched.
overrides:
  "@effect/platform-node@4.0.0-rc.116>@effect/platform-node-shared": "4.0.0-rc.116"

minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.53.3"
  - "@effect/tsgo-darwin-x64@0.53.3"
  - "@effect/tsgo-linux-arm64@0.53.3"
  - "@effect/tsgo-linux-arm@0.53.3"
  - "@effect/tsgo-linux-x64@0.53.3"
  - "@effect/tsgo-win32-arm64@0.53.3"
  - "@effect/tsgo-win32-x64@0.53.3"
  - "@effect/tsgo@0.53.3"
  - "@opencode/ai@2.0.31"
  - "@opencode/client@2.0.31"
  - "@opencode/plugin@2.0.31"
  - "@opencode/protocol@2.0.31"
  - "@opencode/schema@2.0.31"
  - "@opencode/util@2.0.31"
  - pele@1.7.0
