name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # format:check → typecheck → test → build, every package. `lint` is intentionally
      # not here yet: the workspace dogfoods plumb/joggle against itself only once they
      # are moved in (see MIGRATION.md).
      - run: pnpm check
