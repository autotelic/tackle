name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # Exchanged by npm for a short-lived publish credential. No NPM_TOKEN exists in this
  # repository, and none should: see PUBLISHING.md.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 26 does not ship corepack; pnpm comes from its own action. Same step as ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          # Deliberately no `cache: pnpm` here. A poisoned cache is a known way to reach
          # publish credentials, and this job is the only one that holds them.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # With no pending changesets this step runs `publish`; with pending ones it opens the
      # "version packages" PR instead. Publishing authenticates with the runner's OIDC
      # identity, which each package must have been granted once, by a human, with 2FA:
      #
      #   npm trust github @autotelic/<name> \
      #     --repo autotelic/tackle --file release.yml --allow-publish
      #
      # That grant is a browser challenge, not a token, so it never belongs in this file,
      # in Doppler, or in a secret store. It also cannot come first: `npm trust` refuses a
      # package the registry has not seen, so a new package's first version is published with
      # a token once and every version after it comes from here. PUBLISHING.md has the order.
      - uses: changesets/action@v1
        with:
          # `pnpm run`, not `pnpm version`: pnpm has its own `version` command — a semver
          # bump — and it wins over the script, so a bare `pnpm version` dies asking for a
          # version argument instead of reaching `changeset version`.
          version: pnpm run version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
